name: mirror-pjm-data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 6"

permissions:
  contents: write

concurrency:
  group: mirror-pjm-data
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and snapshot PJM feeds
        run: python scripts/fetch_pjm.py

      - name: Commit changed snapshots
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data meta
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git commit -m "data: refresh PJM snapshots $(date -u +%F)"
          git push
